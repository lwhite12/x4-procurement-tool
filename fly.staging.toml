# fly.toml app configuration for the staging deployment of x4 -- a full
# copy of fly.toml, only the app name differs. Deploy with:
#   flyctl deploy --config fly.staging.toml
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'x4-staging'
primary_region = 'iad'

[build]
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
